name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/ecuador-land-explorer-dboau6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Stage the static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/
          cp -R data _site/
          cp README.md _site/
          ls -R _site | head -30

      - name: Configure Pages (enables it if it is off)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
