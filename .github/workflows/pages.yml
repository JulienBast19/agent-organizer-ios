name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, claude/ecuador-land-explorer-dboau6]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Kept free of an `environment:` block on purpose. The github-pages
  # environment does not exist until Pages is switched on, and a job's
  # environment is resolved before its first step runs, so enabling Pages
  # has to happen in a job that does not reference it.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Stage the static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/
          cp -R data _site/
          cp README.md _site/

      - name: Configure Pages, enabling it if it is off
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
